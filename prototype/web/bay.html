<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kōtuku Bay — a moving sketch (Phase 1 preview)</title>
<style>
  html,body { margin:0; padding:0; background:#111; overflow:hidden; height:100%; }
  #c { display:block; width:100vw; height:100vh; touch-action:none; }
  #cap {
    position:fixed; left:50%; bottom:12vh; transform:translateX(-50%);
    max-width:34em; padding:.6em 1.1em; text-align:center;
    font:italic 17px Georgia, serif; color:#f5efdf;
    background:rgba(20,20,20,.55); border-radius:6px;
    opacity:0; transition:opacity .6s ease; pointer-events:none;
  }
  #hint {
    position:fixed; left:50%; top:2.2vh; transform:translateX(-50%);
    font:13px Georgia, serif; color:rgba(245,239,223,.55);
    letter-spacing:.05em; pointer-events:none; text-align:center;
  }
  #start {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1.2em;
    background:#14140f; color:#e8e0c9; font:19px Georgia, serif;
    text-align:center; padding:2em; cursor:pointer;
  }
  #start small { opacity:.6; font-size:14px; max-width:32em; line-height:1.6; }
  #start .go { border:1px solid #8a7c5f; padding:.6em 2.2em; border-radius:4px; }
  .touchbtn {
    position:fixed; bottom:3vh; width:64px; height:64px; border-radius:50%;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.25);
    color:rgba(255,255,255,.7); font:26px Georgia, serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none;
  }
  #tL{left:4vw} #tR{left:calc(4vw + 76px)} #tE{right:4vw; font-size:20px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap"></div>
<div id="hint"></div>
<div id="start">
  <div>KŌTUKU BAY</div>
  <small>A moving sketch of the perception mechanic — procedural art and sound,
  deliberately unfinished. Walk the bay. Do what feels good. Watch what the
  world does. Nothing is explained and nothing is scored.</small>
  <div class="go">begin</div>
  <small>← → or A D to walk &nbsp;·&nbsp; E or tap circle to act &nbsp;·&nbsp; headphones help</small>
</div>
<div class="touchbtn" id="tL" style="display:none">◀</div>
<div class="touchbtn" id="tR" style="display:none">▶</div>
<div class="touchbtn" id="tE" style="display:none">act</div>

<script>
"use strict";
// ═══════════════════════════════════════════════════════════════════
// Kōtuku Bay — Phase 1 preview sketch.
// One value drives everything: guard (0 open … 1 armored).
// open = 1-guard lerps every palette colour, gain and spawn count.
// Nothing is ever shown as a number.
// ═══════════════════════════════════════════════════════════════════

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize); resize();

// ── state ────────────────────────────────────────────────────────────
const WORLD_W = 3400;
const S = {
  guard: 0.78,
  x: 1500, vx: 0, face: 1,
  mode: "walk",           // walk | surf | sit | end
  t: 0,
  phoneDone: false, carvingDone: false,
  benchUsed: 0, talked: {},
  surf: null,
  caps: [], capUntil: 0,
};
const open = () => 1 - S.guard;
const soften = a => { S.guard = Math.max(0.06, S.guard - a); };
const wound  = b => { const f = b * (1 - 0.6 * S.guard); S.guard = Math.min(0.95, S.guard + f); return f; };

// ── captions ─────────────────────────────────────────────────────────
const capEl = document.getElementById("cap");
function cap(text, secs = 4.2) { S.caps.push([text, secs]); }
function capTick(dt) {
  if (S.capUntil > 0) { S.capUntil -= dt; if (S.capUntil <= 0) capEl.style.opacity = 0; return; }
  if (S.caps.length && S.capUntil <= -0.4) {
    const [t, secs] = S.caps.shift();
    capEl.textContent = t; capEl.style.opacity = 1; S.capUntil = secs;
  } else S.capUntil -= dt;
}

// ── palette: every colour is [muted, vivid] lerped by open ───────────
function hx(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function col(mut, viv, k = open()) {
  const a = hx(mut), b = hx(viv);
  const r = a.map((v,i) => Math.round(v + (b[i]-v) * k));
  return `rgb(${r[0]},${r[1]},${r[2]})`;
}
const P = {
  skyTop:    ["#5a5e60", "#7fc4e8"], skyBot: ["#8b8d8a", "#ffe9c4"],
  seaFar:    ["#57605f", "#1f7f9c"], seaNear:["#4a5251", "#2ea3b5"],
  foam:      ["#9aA0a0", "#eafcff"], sand:   ["#8f8a7c", "#e8d5a2"],
  road:      ["#6b6b66", "#9a938a"], hill:   ["#5d635c", "#4d8f4f"],
  bush:      ["#565c55", "#2f7a3c"], trunk:  ["#6a655c", "#7a5c3a"],
  bld1:      ["#75726b", "#d8b46a"], bld2:   ["#6d6f6e", "#b0cf9a"],
  bld3:      ["#7a746e", "#e0937c"], roof:   ["#5c5a55", "#8a4b3a"],
  sign:      ["#8a877e", "#f2e3b8"], np:     ["#5f5f5c", "#c46a4a"],
  np2:       ["#61615e", "#4a7ac4"], flame:  ["#6a6258", "#d4452a"],
  glare:     ["#8d8d88", "#fff3c8"],
};

// ── audio (all synthesized) ──────────────────────────────────────────
let AC = null, gOcean, gBirds, gPad;
function audioInit() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  // ocean: looped filtered noise
  const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0); let last = 0;
  for (let i = 0; i < len; i++) { const w = Math.random()*2-1; last = (last + 0.02*w)/1.02; d[i] = last*3.5; }
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 400;
  gOcean = AC.createGain(); gOcean.gain.value = 0.05;
  src.connect(lp).connect(gOcean).connect(AC.destination); src.start();
  gBirds = AC.createGain(); gBirds.gain.value = 0; gBirds.connect(AC.destination);
  // pad: two soft detuned sines, only audible when open
  gPad = AC.createGain(); gPad.gain.value = 0; gPad.connect(AC.destination);
  [174, 261.8].forEach(f => {
    const o = AC.createOscillator(); o.frequency.value = f; o.type = "sine";
    const g = AC.createGain(); g.gain.value = 0.35;
    o.connect(g).connect(gPad); o.start();
  });
}
function chirp() {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  const f0 = 1400 + Math.random()*1200;
  o.frequency.setValueAtTime(f0, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(f0*(1.3+Math.random()*0.6), AC.currentTime+0.12);
  g.gain.setValueAtTime(0.0001, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.12, AC.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+0.25);
  o.connect(g).connect(gBirds); o.start(); o.stop(AC.currentTime+0.3);
}
let chirpAt = 0;
function audioTick(dt) {
  if (!AC) return;
  const beachNear = Math.max(0, 1 - Math.abs(S.x - 700)/1400);
  gOcean.gain.value = 0.02 + 0.10*beachNear + 0.05*open();
  gBirds.gain.value = Math.max(0, open()-0.25) * 0.9;
  gPad.gain.value   = Math.max(0, open()-0.55) * 0.05;
  chirpAt -= dt;
  if (chirpAt <= 0) { if (open() > 0.3 && Math.random() < open()) chirp(); chirpAt = 0.7 + Math.random()*2.2; }
}

// ── input ────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; if (e.key===" ") keys.space = true; });
window.addEventListener("keyup",   e => { keys[e.key.toLowerCase()] = false; if (e.key===" ") keys.space = false; });
const isTouch = "ontouchstart" in window;
for (const [id, k] of [["tL","arrowleft"],["tR","arrowright"],["tE","e"]]) {
  const el = document.getElementById(id);
  el.addEventListener("touchstart", e => { e.preventDefault(); keys[k] = true;  }, {passive:false});
  el.addEventListener("touchend",   e => { e.preventDefault(); keys[k] = false; }, {passive:false});
}

// ── places ───────────────────────────────────────────────────────────
const PL = {
  surfZone:  { x: 430,  w: 260, label: "paddle out" },
  bench:     { x: 1180, w: 90,  label: "sit a while" },
  dairy:     { x: 1550, w: 120, label: "the dairy" },
  pub:       { x: 1980, w: 140, label: "the pub" },
  mara:      { x: 2450, w: 120, label: "Mara's place" },
  reserve:   { x: 3060, w: 140, label: "the track" }, // only visible when open
};
function near(p) { return Math.abs(S.x - p.x) < p.w; }

// ── dialogue (three registers, chosen by open()) ─────────────────────
function reg() { return open() < 0.35 ? 0 : open() < 0.65 ? 1 : 2; }
const LINES = {
  dairy: [
    "Mrs Hema counts your change without looking up. \"Cold out,\" she says, to the till.",
    "\"Pies are back Thursday,\" Mrs Hema says, and almost smiles. The tūī outside starts up mid-sentence.",
    "Mrs Hema is singing to the pie warmer when you come in, and doesn't fully stop. \"You've got some colour back,\" she says. \"Suits you.\"",
  ],
  pub: [
    "Rewi nods. You nod. The replay flickers above the bar. That's the whole conversation.",
    "\"Swell's building for the weekend,\" Rewi says, pouring. \"You should get out there while it's clean.\"",
    "Rewi leans on the bar. \"You know,\" he says, \"my old man used to say this town tells you everything, if you're the right speed to hear it.\" He taps the tap twice, like punctuation.",
  ],
  mara: [
    "Mara answers on the fourth knock. \"Mate.\" The door opens body-width. Rugby, roof, weather. The door closes warmly enough.",
    "Mara makes tea strong enough to stand a spoon in. Twice she starts a sentence and lets it go, like a wave she's decided not to catch.",
    "Mara's kitchen is very, very clean. On the way out you carry the recycling down for her, old habit, and the bin swings heavier than one person's fortnight should. You hold the lid a second longer than you need to.",
  ],
};

// ── interactions ─────────────────────────────────────────────────────
let eLatch = false;
function tryAct() {
  if (S.mode !== "walk") return;
  if (near(PL.surfZone)) { startSurf(); return; }
  if (near(PL.bench)) {
    S.mode = "sit"; S.sitT = 3.2;
    cap(["You sit. The sea does what the sea does.",
         "The bench holds sixty years of initials. Yours are here somewhere.",
         "Seventeen, terrified, kissed first — right here. You let the memory sit down next to you."][reg()], 4.5);
    return;
  }
  for (const key of ["dairy","pub","mara"]) {
    if (near(PL[key])) {
      cap(LINES[key][reg()], 5.2);
      const n = (S.talked[key] || 0) + 1; S.talked[key] = n;
      soften(n <= 2 ? 0.035 : 0.015);
      return;
    }
  }
  if (near(PL.reserve) && open() > 0.6 && !S.carvingDone) {
    S.carvingDone = true;
    cap("The track climbs past the water tank to the big tōtara.", 3.5);
    cap("Chest height, grey with age, cut deep by children's hands: a spiral, and two stick figures holding hands.", 5.5);
    cap("Underneath, in letters that took a whole afternoon: \"WE PROMISED.\"", 5);
    cap("You have walked past the bottom of this track a thousand times.", 5);
    soften(0.05);
    setTimeout(endCard, 22000);
  }
}
function endCard() {
  if (S.mode === "end") return;
  S.mode = "end";
  cap("This was ninety seconds of Phase 1. The real game is ten years here — and the town remembers all of them.", 8);
  cap("(Refresh to walk it again, more armored or less.)", 8);
}

// ── surf toy ─────────────────────────────────────────────────────────
function startSurf() {
  S.mode = "surf";
  S.surf = { phase: "wait", waveX: -600, py: 0, bal: 0, rideT: 0, rides: 0, eReleased: false };
  cap(["The water is a chore you happen to love.",
       "The water takes your weight like it remembers you.",
       "The water is lit from inside today."][reg()], 3.5);
  cap("A wave will come. Press E (or act) as it lifts you. Lean ← → to stay on.", 4);
}
function surfTick(dt) {
  const s = S.surf;
  if (!keys.e) s.eReleased = true;
  if (s.phase === "wait") {
    s.waveX += dt * 260;
    if (s.waveX > -40 && s.waveX < 60) {
      if (keys.e || keys.space) { s.phase = "ride"; s.rideT = 0; s.bal = 0; keys.e = false; }
    } else if (s.waveX >= 60) {
      s.phase = "missed"; s.mt = 1.2;
      cap(["Missed it. The sea doesn't care.", "Missed it — the next one's already gathering.", "Missed it, laughing."][reg()], 2);
    }
  } else if (s.phase === "missed") {
    s.mt -= dt; if (s.mt <= 0) { s.waveX = -600 - Math.random()*200; s.phase = "wait"; }
  } else if (s.phase === "ride") {
    s.rideT += dt;
    s.bal += (Math.sin(s.rideT*2.1)*0.55 + Math.sin(s.rideT*3.7)*0.35) * dt * (1.1 - 0.4*open());
    if (keys.arrowleft || keys.a) s.bal -= dt*1.5;
    if (keys.arrowright || keys.d) s.bal += dt*1.5;
    if (Math.abs(s.bal) > 1 || s.rideT > 6) {
      const good = s.rideT;
      s.rides++;
      soften(Math.min(0.028 * good, 0.09));
      cap(good > 4.5
        ? ["Long ride. Something in you unclenches a finger.", "Long ride. Your shoulders come down an inch.", "Long ride — fourteen again, in the only way that was ever good."][reg()]
        : "Short one. The next wave is already gathering.", 3);
      if (s.rides >= 3) { S.mode = "walk"; S.surf = null; cap("Enough. You wade in with salt in your eyebrows.", 3); return; }
      s.phase = "wait"; s.waveX = -650 - Math.random()*250;
    }
  }
  if (keys.e && s.eReleased && s.phase === "wait" && s.waveX < -120) { // paddle in early
    S.mode = "walk"; S.surf = null; keys.e = false;
    cap("You wade in. The bay carries on without you, comfortably.", 3);
  }
}

// ── scripted beat: the phone call ────────────────────────────────────
function maybePhone() {
  if (S.phoneDone || S.t < 75 || S.mode !== "walk") return;
  S.phoneDone = true;
  const felt = wound(0.16);
  cap("Your phone. Mum. Dad's had a turn — they're keeping him in overnight for tests.", 5.5);
  cap(felt < 0.08
      ? "The news lands somewhere offshore of you, like weather over the horizon. You keep walking."
      : felt < 0.12
      ? "Your chest does something complicated. The street looks suddenly further away."
      : "It goes through you like cold water. The whole bay dims — you can feel exactly how much he matters.", 6);
}

// ── drawing ──────────────────────────────────────────────────────────
function draw(t) {
  const o = open();
  const horizon = H*0.42, ground = H*0.78;
  const camX = Math.max(0, Math.min(S.x - W/2, WORLD_W - W));
  // sky
  const sky = ctx.createLinearGradient(0,0,0,horizon*1.2);
  sky.addColorStop(0, col(...P.skyTop)); sky.addColorStop(1, col(...P.skyBot));
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,horizon+2);
  // sun glare (clear only)
  if (o > 0.45) {
    const gl = ctx.createRadialGradient(W*0.28, horizon*0.5, 10, W*0.28, horizon*0.5, 260);
    gl.addColorStop(0, col(...P.glare)); gl.addColorStop(1, "rgba(255,243,200,0)");
    ctx.globalAlpha = (o-0.45)*1.4; ctx.fillStyle = gl;
    ctx.fillRect(0,0,W,horizon); ctx.globalAlpha = 1;
  }
  // sea
  const sea = ctx.createLinearGradient(0,horizon,0,ground);
  sea.addColorStop(0, col(...P.seaFar)); sea.addColorStop(1, col(...P.seaNear));
  ctx.fillStyle = sea; ctx.fillRect(0,horizon,W,ground-horizon);
  // wave lines
  ctx.strokeStyle = col(...P.foam); ctx.lineWidth = 1.5;
  for (let i=0;i<5;i++) {
    const y = horizon + (ground-horizon)*(0.25+0.17*i);
    ctx.globalAlpha = 0.25 + 0.4*o;
    ctx.beginPath();
    for (let x=0;x<=W;x+=14)
      ctx.lineTo(x, y + Math.sin((x+camX)*0.012 + t*(0.9+i*0.15))*3.2*(1+o));
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // beach / road
  ctx.fillStyle = col(...P.sand);
  ctx.beginPath(); ctx.moveTo(0,ground);
  for (let x=0;x<=W;x+=22) ctx.lineTo(x, ground + Math.sin((x+camX)*0.01)*4);
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();
  ctx.fillStyle = col(...P.road); ctx.fillRect(0, ground+28, W, 26);
  // hill + reserve (right end)
  const hx0 = 2850 - camX;
  ctx.fillStyle = col(...P.hill);
  ctx.beginPath(); ctx.moveTo(hx0, ground+30);
  ctx.quadraticCurveTo(hx0+320, ground-320, hx0+760, ground+30); ctx.fill();
  for (let i=0;i<7;i++) { // bush blobs
    ctx.fillStyle = col(...P.bush);
    ctx.beginPath();
    ctx.ellipse(hx0+140+i*72, ground-30-((i*37)%110), 46, 30, 0, 0, 7); ctx.fill();
  }
  if (o > 0.6) { // the track & sign — literally not rendered when guarded
    ctx.strokeStyle = col(...P.sand); ctx.lineWidth = 7; ctx.globalAlpha = Math.min(1,(o-0.6)*4);
    ctx.beginPath(); ctx.moveTo(PL.reserve.x-camX, ground+30);
    ctx.quadraticCurveTo(PL.reserve.x-camX+50, ground-90, PL.reserve.x-camX+130, ground-160);
    ctx.stroke();
    ctx.fillStyle = col(...P.sign);
    ctx.fillRect(PL.reserve.x-camX-6, ground-6, 5, 36);
    ctx.fillRect(PL.reserve.x-camX-22, ground-14, 38, 12);
    ctx.globalAlpha = 1;
  }
  // buildings
  building(PL.dairy.x-camX, ground, 130, 74, P.bld1, "DAIRY", t);
  building(PL.pub.x-camX,   ground, 170, 88, P.bld2, "TAVERN", t);
  building(PL.mara.x-camX,  ground, 110, 66, P.bld3, "", t);
  // flame tree + tui by dairy
  tree(PL.dairy.x-260-camX, ground+30, t, o);
  // bench
  const bx = PL.bench.x-camX;
  ctx.fillStyle = col(...P.trunk);
  ctx.fillRect(bx-26, ground-2, 52, 5); ctx.fillRect(bx-26, ground-16, 52, 5);
  ctx.fillRect(bx-22, ground-16, 4, 20); ctx.fillRect(bx+18, ground-16, 4, 20);
  // NPCs: count & liveliness scale with open
  npc(PL.dairy.x+90-camX, ground+26, P.np, o, t, 0);
  if (o > 0.3) npc(PL.pub.x-70-camX + Math.sin(t*0.35)*40*o, ground+26, P.np2, o, t, 1);
  if (o > 0.55) npc(900-camX + ((t*30)%700), ground+26, P.np, o, t, 2);   // kid with board
  if (o > 0.55) npc(980-camX + ((t*30)%700), ground+26, P.np2, o, t, 3);
  // birds
  const nb = Math.floor(o*9);
  for (let i=0;i<nb;i++) {
    const bxp = ((i*467 + t*(26+i*7)) % (W+160)) - 80;
    const byp = 40 + (i*53)%Math.max(1,(horizon-90)) + Math.sin(t*2+i)*6;
    bird(bxp, byp);
  }
  // player
  if (S.mode === "surf") drawSurf(t, horizon, ground, camX);
  else drawPlayer(S.x-camX, ground+26, t);
  // prompts
  promptTick(camX, ground);
  // vignette = guard, the one honest tell
  const vg = ctx.createRadialGradient(W/2,H/2,H*0.3, W/2,H/2,H*0.85);
  vg.addColorStop(0,"rgba(0,0,0,0)");
  vg.addColorStop(1,`rgba(10,10,12,${0.15 + S.guard*0.55})`);
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
}
function building(x, ground, w, h, pal, label, t) {
  ctx.fillStyle = col(...pal); ctx.fillRect(x-w/2, ground-h, w, h+28);
  ctx.fillStyle = col(...P.roof);
  ctx.beginPath(); ctx.moveTo(x-w/2-10, ground-h); ctx.lineTo(x, ground-h-26); ctx.lineTo(x+w/2+10, ground-h); ctx.fill();
  ctx.fillStyle = "rgba(20,20,25,.55)"; ctx.fillRect(x-12, ground-34, 24, 62); // door
  if (label) {
    ctx.fillStyle = col(...P.sign); ctx.fillRect(x-w/4-4, ground-h+8, w/2+8, 16);
    ctx.fillStyle = "rgba(40,35,25,.8)"; ctx.font = "11px Georgia";
    ctx.textAlign = "center"; ctx.fillText(label, x, ground-h+20);
  }
}
function bird(x, y) {
  ctx.strokeStyle = "rgba(30,35,40,.75)"; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x-6, y); ctx.quadraticCurveTo(x-3, y-5, x, y);
  ctx.quadraticCurveTo(x+3, y-5, x+6, y);
  ctx.stroke();
}
function tree(x, y, t, o) {
  ctx.fillStyle = col(...P.trunk); ctx.fillRect(x-5, y-70, 10, 70);
  ctx.fillStyle = col(...P.flame);
  for (let i=0;i<5;i++) {
    ctx.beginPath();
    ctx.ellipse(x + Math.sin(i*2.2)*30, y-85-((i*23)%40), 34, 22, 0, 0, 7); ctx.fill();
  }
  if (o > 0.35) { // the tūī, hopping when the world is open
    const hop = Math.abs(Math.sin(t*3))* (o>0.6?8:3);
    ctx.fillStyle = "#1a2320";
    ctx.beginPath(); ctx.ellipse(x+14, y-96-hop, 7, 5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#e8e5da";
    ctx.beginPath(); ctx.arc(x+11, y-97-hop, 2, 0, 7); ctx.fill(); // the white tuft
  }
}
function npc(x, y, pal, o, t, i) {
  if (x < -40 || x > W+40) return;
  const walkA = o > 0.3 ? Math.sin(t*4+i*2)*4*o : 0;
  ctx.fillStyle = col(...pal);
  ctx.fillRect(x-6, y-40, 12, 26);                     // body
  ctx.beginPath(); ctx.arc(x, y-47, 6, 0, 7); ctx.fill(); // head
  ctx.strokeStyle = col(...pal); ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x-3, y-15); ctx.lineTo(x-3-walkA, y);
  ctx.moveTo(x+3, y-15); ctx.lineTo(x+3+walkA, y); ctx.stroke();
  if (i>=2) { ctx.fillStyle = col("#7a776e","#f2f2ea"); ctx.fillRect(x+8, y-38, 5, 30); } // surfboard
}
function drawPlayer(x, y, t) {
  const moving = Math.abs(S.vx) > 5, wA = moving ? Math.sin(t*9)*6 : 0;
  const bob = S.mode==="sit" ? 8 : 0;
  ctx.fillStyle = "#20232a";
  ctx.fillRect(x-7, y-44+bob, 14, 28);
  ctx.beginPath(); ctx.arc(x, y-52+bob, 7, 0, 7); ctx.fill();
  ctx.strokeStyle = "#20232a"; ctx.lineWidth = 5;
  if (S.mode==="sit") {
    ctx.beginPath(); ctx.moveTo(x-4,y-16+bob); ctx.lineTo(x-12,y-4); ctx.moveTo(x+4,y-16+bob); ctx.lineTo(x+12,y-4); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(x-3,y-16); ctx.lineTo(x-3-wA,y); ctx.moveTo(x+3,y-16); ctx.lineTo(x+3+wA,y); ctx.stroke();
  }
}
function drawSurf(t, horizon, ground, camX) {
  const s = S.surf, seaY = horizon + (ground-horizon)*0.62;
  const px = 560 - camX + (S.x-560)*0; // fixed surf spot on screen coords
  const sx = PL.surfZone.x - camX;
  // incoming wave bump
  const wx = sx + s.waveX;
  ctx.fillStyle = col(...P.foam); ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.moveTo(wx-90, seaY+8);
  ctx.quadraticCurveTo(wx, seaY-26-(open()*10), wx+90, seaY+8); ctx.fill();
  ctx.globalAlpha = 1;
  const riding = s.phase === "ride";
  const bx = riding ? wx : sx, by = riding ? seaY-24 : seaY-4;
  const lean = riding ? s.bal*0.5 : 0;
  ctx.save(); ctx.translate(bx, by); ctx.rotate(lean);
  ctx.fillStyle = col("#7a776e","#f2f2ea"); ctx.fillRect(-16, 2, 32, 5); // board
  ctx.fillStyle = "#20232a";
  ctx.fillRect(-6, -26, 12, 24);
  ctx.beginPath(); ctx.arc(0, -32, 6, 0, 7); ctx.fill();
  ctx.restore();
  if (riding) { // spray
    ctx.fillStyle = col(...P.foam);
    for (let i=0;i<8;i++) {
      ctx.globalAlpha = 0.5*Math.random();
      ctx.fillRect(bx-20-Math.random()*20, by+6-Math.random()*10, 3, 3);
    }
    ctx.globalAlpha = 1;
  }
}
const hintEl = document.getElementById("hint");
function promptTick(camX, ground) {
  let h = "";
  if (S.mode === "walk") {
    for (const key in PL) {
      const p = PL[key];
      if (key === "reserve" && (open() <= 0.6 || S.carvingDone)) continue;
      if (near(p)) { h = `[E] ${p.label}`; break; }
    }
  } else if (S.mode === "surf") {
    h = S.surf.phase === "ride" ? "lean ← → " : "[E] catch it — or wait";
  }
  hintEl.textContent = h;
}

// ── update ───────────────────────────────────────────────────────────
let last = 0;
function frame(ms) {
  const t = ms/1000, dt = Math.min(t-last, 0.05); last = t;
  S.t += dt;
  if (S.mode === "walk" || S.mode === "end") {
    const L = keys.arrowleft || keys.a, R = keys.arrowright || keys.d;
    S.vx = (R?220:0) - (L?220:0);
    S.x = Math.max(80, Math.min(WORLD_W-80, S.x + S.vx*dt));
    if ((keys.e) && !eLatch) { eLatch = true; tryAct(); }
    if (!keys.e) eLatch = false;
  } else if (S.mode === "sit") {
    S.sitT -= dt;
    if (S.sitT <= 0) { soften(0.05); S.mode = "walk"; S.benchUsed++; }
  } else if (S.mode === "surf") {
    if (keys.e && !eLatch) { eLatch = true; }
    surfTick(dt);
    if (!keys.e) eLatch = false;
  }
  maybePhone();
  audioTick(dt);
  capTick(dt);
  draw(S.t);
  requestAnimationFrame(frame);
}

// ── start ────────────────────────────────────────────────────────────
document.getElementById("start").addEventListener("click", () => {
  document.getElementById("start").style.display = "none";
  if (isTouch) for (const id of ["tL","tR","tE"]) document.getElementById(id).style.display = "flex";
  try { audioInit(); } catch (e) {}
  cap("Kōtuku Bay. An ordinary morning.", 3.5);
  cap("Do what feels good. Watch what the world does.", 4);
  requestAnimationFrame(ms => { last = ms/1000; requestAnimationFrame(frame); });
});

// test hook (not part of the game)
window.__bay = { get guard(){return S.guard;}, set guard(v){S.guard=v;}, state: S };
</script>
